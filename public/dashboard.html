<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Jaro Academic</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Jaro<span> Academic</span></a><nav><a href="/tasks.html">Opportunities</a><button id="logout" class="btn small">Sign out</button></nav></div></header>
<main class="section"><div class="wrap"><div id="app">Loading…</div></div></main>
<script>
async function load(){const m=await (await fetch("/api/me")).json();if(!m.user){location.href="/login.html";return}
app.innerHTML=`<div class="top"><h1>Welcome, ${m.user.name}</h1><p class="muted">${m.user.email} · ${m.user.role}</p></div>
<div class="grid2"><div class="panel"><h2>Post a task</h2><form id="taskForm"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Category</label><select name="category"><option>Research guidance</option><option>Tutoring</option><option>Proofreading & editing</option><option>Data analysis</option><option>R / Python / SQL</option><option>CV & cover letter</option><option>Professional writing</option><option>Other</option></select></div><div class="field"><label>Description</label><textarea name="description" required></textarea></div><div class="grid2"><div class="field"><label>Min budget (KES)</label><input name="budget_min" type="number"></div><div class="field"><label>Max budget (KES)</label><input name="budget_max" type="number"></div></div><div class="field"><label>Deadline</label><input name="deadline" type="datetime-local"></div><button class="btn">Post task</button></form><div id="msg"></div></div>
<div class="panel"><h2>Your orders</h2><div id="orders">Loading…</div><h2 style="margin-top:28px">Your tasks</h2><div id="tasks">Loading…</div></div></div>`;
document.querySelector("#taskForm").onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(r.ok){msg.innerHTML="<div class='success'>Task posted successfully.</div>";e.target.reset();loadData()}else msg.innerHTML="<div class='error'>"+d.error+"</div>"};loadData()}
async function loadData(){const [a,b]=await Promise.all([fetch("/api/my/orders"),fetch("/api/my/tasks")]);const o=await a.json(),t=await b.json();orders.innerHTML=o.orders.length?o.orders.map(x=>`<div class="card"><b>${x.title}</b><p class="muted">${x.status} · KES ${x.agreed_amount} · ${x.other_party}</p>${x.status==="awaiting_payment"&&x.client_user_id?`<button class="btn small" onclick="pay('${x.id}')">Pay securely</button>`:""}</div>`).join(""):"<p class='muted'>No orders yet.</p>";tasks.innerHTML=t.tasks.length?t.tasks.map(x=>`<a class="card" href="/task.html?id=${x.id}"><b>${x.title}</b><p class="muted">${x.status} · ${x.bid_count} proposal(s)</p></a>`).join(""):"<p class='muted'>No tasks yet.</p>"}
async function pay(id){const r=await fetch("/api/orders/"+id+"/checkout",{method:"POST"});const d=await r.json();if(r.ok)location.href=d.checkout_url;else alert(d.error||"Checkout unavailable")}
logout.onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/"}
load();
</script></body></html>
