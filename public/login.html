<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Jaro Academic</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Jaro<span> Academic</span></a><a href="/register.html">Create account</a></div></header>
<main class="section"><div class="wrap"><div class="form card"><h1>Welcome back</h1><p class="muted">Sign in to post tasks, submit proposals and manage payments.</p><div id="msg"></div><form id="f"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn">Sign in</button></form></div></div></main>
<script>f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(r.ok)location.href="/dashboard.html";else msg.innerHTML="<div class='error'>"+d.error+"</div>"}</script></body></html>
