<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status · Jaro Academic</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Jaro<span> Academic</span></a><a class="btn small" href="/dashboard.html">Dashboard</a></div></header>
<main class="section"><div class="wrap"><div class="form card"><h1 id="title">Checking payment…</h1><p id="msg" class="muted">Please wait while we check the transaction.</p><a class="btn" href="/dashboard.html">Go to dashboard</a></div></div></main>
<script>
const id=new URLSearchParams(location.search).get("order_id");
async function check(){const r=await fetch("/api/orders/"+encodeURIComponent(id)+"/status");const d=await r.json();if(!r.ok){title.textContent="Sign in to view payment";msg.textContent=d.error||"Open your dashboard.";return}if(d.payment?.status==="confirmed"&&d.order?.status==="funded"){title.textContent="Payment confirmed";msg.textContent="Your order is funded and the provider can proceed."}else if(d.payment?.status==="failed"){title.textContent="Payment failed";msg.textContent="The payment was not completed. Return to the order and try again."}else{title.textContent="Payment pending";msg.textContent="The gateway is still confirming the transaction. Refresh this page in a moment."}}check();
</script></body></html>
