<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Jaro Academic</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Jaro<span> Academic</span></a><a href="/login.html">Sign in</a></div></header>
<main class="section"><div class="wrap"><div class="form card"><h1>Create your account</h1><p class="muted">Use Jaro Academic for legitimate academic and professional support.</p><div id="msg"></div><form id="f"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>I want to</label><select name="role"><option value="both">Post tasks & provide services</option><option value="client">Post tasks</option><option value="provider">Provide services</option></select></div><button class="btn">Create account</button></form></div></div></main>
<script>f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(r.ok)location.href="/dashboard.html";else msg.innerHTML="<div class='error'>"+d.error+"</div>"}</script></body></html>
