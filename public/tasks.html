<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunities · Jaro Academic</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="nav"><div class="wrap navin"><a class="brand" href="/">Jaro<span> Academic</span></a><nav><a href="/dashboard.html">Dashboard</a><a class="btn small" href="/register.html">Join</a></nav></div></header>
<main class="section"><div class="wrap"><div class="top"><h1>Open opportunities</h1><p class="muted">Browse tasks that need legitimate academic or professional support.</p></div><div id="list" class="tasklist">Loading…</div></div></main>
<script>async function load(){const r=await fetch("/api/tasks");const d=await r.json();list.innerHTML=d.tasks.length?d.tasks.map(t=>`<a class="card task" href="/task.html?id=${t.id}"><div><span class="tag">${t.category}</span><h3>${t.title}</h3><p class="muted">${String(t.description).slice(0,150)}${t.description.length>150?"…":""}</p><small class="muted">${t.bid_count} proposal(s) · ${t.client_name}</small></div><div class="right"><div class="price">KES ${Number(t.budget_min||0).toLocaleString()}–${Number(t.budget_max||0).toLocaleString()}</div></div></a>`).join(""):"<div class='card'>No open opportunities yet. Be the first to post one.</div>"}load()</script></body></html>
